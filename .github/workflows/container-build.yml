name: Container Build

on:
    workflow_call:
        inputs:
            repo-name:
                type: string
                description: 'Repository name (folder in the container repository)'
                required: true
            container-tag:
                type: string
                description: 'Container tag'
                required: true
            build-stage:
                type: string
                description: 'Type: dev/prod'
                required: true
                default: dev

jobs:
    build:
        name: Build App Container (${{ inputs.build-stage }})
        runs-on: ubuntu-latest
        permissions:
            contents: read
        env:
            APP: datawiz2
            GH_SHA: ${{ github.sha }}
        steps:
            - name: Check out the repo
              uses: actions/checkout@v7

            - name: Azure Login
              uses: azure/login@v3
              with:
                  creds: "${{ secrets.AZURE_CREDENTIALS }}"

            - name: Connect to Azure Container Registry (ACR)
              run: |
                  az acr login --name ${{ secrets.ACR_NAME }}

            - name: Build and push PHP-FPM image
              run: |
                  ACR="${{ secrets.ACR_NAME }}.azurecr.io"
                  PHP_FPM_IMAGE="$ACR/${{ inputs.repo-name }}/${{ env.APP }}_php_fpm"
                  CR_IMAGE_SHA="${PHP_FPM_IMAGE}:${{ env.GH_SHA }}"
                  CR_IMAGE_TAG="${PHP_FPM_IMAGE}:${{ inputs.container-tag }}"

                  docker build . \
                    -t "${CR_IMAGE_SHA}" \
                    -t "${CR_IMAGE_TAG}" \
                    --file .github/workflows/manifests/php/${{ inputs.build-stage }}.Dockerfile
                  docker push "${CR_IMAGE_SHA}"
                  docker push "${CR_IMAGE_TAG}"

            - name: Build and push NGINX image
              run: |
                  ACR="${{ secrets.ACR_NAME }}.azurecr.io"
                  NGINX_IMAGE="$ACR/${{ inputs.repo-name }}/${{ env.APP }}_nginx"
                  CR_IMAGE_SHA="${NGINX_IMAGE}:${{ env.GH_SHA }}"
                  CR_IMAGE_TAG="${NGINX_IMAGE}:${{ inputs.container-tag }}"

                  docker build . \
                    -t "${CR_IMAGE_SHA}" \
                    -t "${CR_IMAGE_TAG}" \
                    --file .github/workflows/manifests/nginx/Dockerfile
                  docker push "${CR_IMAGE_SHA}"
                  docker push "${CR_IMAGE_TAG}"
