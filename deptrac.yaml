deptrac:
    paths:
        - ./src
    exclude_files:
        - '#.*test.*#'
    layers:
        -
            name: Controller
            collectors:
                -
                    type: classLike
                    value: .*Controller.*
        -
            name: Repository
            collectors:
                -
                    type: classLike
                    value: App\\Repository\\.*
        -
            name: Service
            collectors:
                -
                    type: classLike
                    value: App\\Service.*
    ruleset:
        Controller:
            - Service
        Service:
            - Repository
        Repository:
