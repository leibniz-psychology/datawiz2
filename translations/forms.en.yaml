basic_information_meta_data_group:
    title:
        legend: 'Title'
        label: 'Provide a title for your dataset'
    title_translated:
        legend: 'Translated title'
        label: 'Is there an alternative title (e.g., abbreviation or translation)? If your title is not in English, please provide the English translation here.'
    study_id:
        legend: 'Study ID'
        label: 'Provide a unique identifier for your study'
    description:
        legend: 'Description'
        label: 'Provide a short summary of the study'
    description_translated:
        legend: 'Translated Description'
        label: 'If your description is not in English, please provide the English translation here.'
    data_status:
        legend: 'Data status'
        label: 'State whether the uploaded data is a complete or partial representation of the collected data.'
    reuse_potential:
        legend: 'Reuse potential'
        label: 'State measures to ensure reuse potential of the subset'
    study_relation:
        legend: 'Study relation'
        label: 'State the relation to previous work'
    study_relation_other_description:
        legend: 'Study relation description'
        label: 'Provide a description of the relation to previous work'
    used_softwares:
        legend: 'Used software'
        label: 'Indicate which software was used for which step'
        help: 'Enter one software per field. Leave empty if not applicable'
    related_publications:
        legend: 'Related publications'
        label: 'Provide citations and persistent identifiers of the publications directly based on this data collection.'
        help: 'Enter one publication per field. Leave empty if not applicable'
    conflicts_of_interest:
        legend: 'Conflicts of interest'
        label: 'State any existing conflicts of interest.'
        help: 'Enter one conflict of interest per field. Leave empty if not applicable'
    creators:
        legend: 'Creators'
        label: 'The persons responsible for the research data.'

creator_meta_data_group:
    given_name:
        label: 'Given name'
    family_name:
        label: 'Family name'
    email:
        label: 'Email'
    orcid:
        label: 'ORCID'
    affiliation:
        label: 'Affiliation'
    credit_roles:
        label: 'Roles'

measure_meta_data_group:
    data_collection_start:
        legend: 'Data collection Period'
        label: 'Data collection start'
    data_collection_end:
        label: 'Data collection end'
    collection_mode:
        legend: 'Collection mode'
        label: 'Describe the method that was used to collect data.'
    apparatus:
        legend: 'Apparatus (instruments, equipment)'
        label: 'Which instruments (apparatus, equipment) did you use in your study?'
        add: 'Add another apparatus'
    collection_mode_other_description:
        label: 'If other, please describe the method'
    sampling_method:
        legend: 'Sampling method'
        label: 'Provide remarks on persons or institutions responsible for data collection.'
    sampling_method_other_description:
        label: 'If other, please describe the method'
    recruiting:
        legend: 'Recruiting'
        label: 'The procedure for the recruitment of units.'
    original_record_type:
        legend: 'Original record type'
        label: 'The original record type of the data.'
    original_record_type_other_description:
        label: 'If other, please describe the original record type'
    raw_data_digitization:
        legend: 'Digitization of raw data'
        label: 'Describe to which degree the uploaded data reflects the information contained in the original records.'
    raw_data_digitization_description:
        label: 'Please describe the digitization process'
    special_circumstances:
        legend: 'Special circumstances'
        label: 'Describe any special circumstances of the data collection.'
    raw_data_transformation:
        legend: 'Transformation or aggregation of raw data'
        label: 'Describe transformations or aggregations of raw data (e.g. reversed-polarity, index creation, calculation of scale values) or refer to documents or syntax containing the relevant information under study materials.'
    quality_indicators:
        legend: 'Quality indicators'
        label: 'Indicate all measures of data quality control during data collection (e.g., standard lab practices, lab protocols, interrater reliability training, approaches for coding of data, discarding of cases, correction of scores, or dealing with participants who were incorrectly sampled although they do not meet the inclusion criteria).'
    limitations:
        legend: 'Limitations'
        label: 'Describe any limitations to data quality, e.g., baseline differences, low measurement reliability.'

measurement_instrument:
    title:
        label: 'Title'
    author:
        label: 'Author'
        help: 'You may skip this field, if a citation was provided for this instrument.'
    citation:
        label: 'Citation'
    abstract:
        label: 'Abstract'
        help: 'This information is recommended for newly developed instruments only. A short description of the instrument.'
    theoretical_background:
        label: 'Instrument concept: theoretical background'
        help: 'This information is recommended for newly developed instruments only. Details about the theoretical background of the procedure, underlying theoretical models, research contexts and goals of the procedure.'
    structure:
        label: 'Instrument concept: structure'
        help: 'This information is recommended for newly developed instruments only. Details about number of items, existing sub scales, answering mode, evaluation procedure, further information on test procedures for non-questionnaires. '
    development:
        label: 'Instrument development'
        help: 'This information is recommended for newly developed instruments only. Refers to the specific measurement model: classical or probabilistic test theory. Provides information on item pools, test pre-forms, item selection criteria and techniques, item parameter like item-total correlation or item difficulties, item and scale inter-correlations, person and item parameters, samples, factor analytical results, etc.'
    objectivity:
        label: 'Quality criteria: Objectivity'
        help: 'This information is recommended for newly developed instruments only. Statement on the objectivity of the method regarding implementation, evaluation, and interpretation through rater/observer agreement.'
    reliability:
        label: 'Quality criteria: Instrument reliability'
        help: 'This information is recommended for newly developed instruments only. Information regarding internal consistency, homogeneity, stability, parallel-forms reliability, split-half reliability, retest reliability, inter-rater reliability, etc.'
    validity:
        label: 'Quality Criteria: Instrument validity'
        help: 'This information is recommended for newly developed instruments only. Information on validity (logical, content, curricular, differential, factor, internal, and external validity, construct validity, concurrent validity or empirical validity (criterion validity) as concurrent and predictive validity. '
    norm_referenced:
        label: 'Quality criteria: norm-referenced'
        help: 'This information is recommended for newly developed instruments only. Make statements on the type of norm values that exist, or alternatively on mean values or comparative values for different samples. Gives details on calibration samples, or rather on the representativeness of the sample used.'

measurement_occasion:
    time_of_measurement:
