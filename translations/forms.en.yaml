        label: 'Construct'
    function:
        label: 'Function'
        placeholder: 'Choose a function'
    other_function_description:
        label: 'If other, please describe the function'

method_meta_data_group:
    research_design:
        legend: 'Research Design'
        label: 'State the time dimension of your data collection, whether it is a single or multiple measurement occasion'
    research_design_description:
        legend: 'Research Design Description'
        label: 'Description of the Longitudinal Study Design'
        help: 'Please provide information on the measurement plan that was applied (e.g. Follow-up, longitudinal analysis, cohort study, sequence model). If applicable differentiate information by group or cohort.'
    research_method:
        legend: 'Research method'
        label: 'Choose your type of research method'
    experimental_details:
        label: 'Further describe the <span class="font-semibold">experimental design</span> of your study'
    non_experimental_details:
        label: 'Further describe the <span class="font-semibold">non-experimental design</span> of your study'
    survey_instrument_type:
        legend: 'Survey instrument type'
        label: 'Choose the type of survey instrument used'
        placeholder: 'Choose a survey instrument type'
    setting:
        legend: 'Setting'
        label: 'Choose your setting'
    setting_location:
        legend: 'Location'
        label: 'For real-life and natural settings enter the location where your study took place'
    observational_type:
        legend: 'Observational study'
        label: 'Optionally define the observational type of your study'
        placeholder: 'Choose an observational type'
    manipulations:
        legend: 'Experimental manipulations, treatments, or interventions'
        label: 'Provide details of your experimental manipulation(s) including a summary
          of the instructions. Clearly define your variables (treatments).'
    experimental_design:
        legend: 'Design'
        label: 'How were participants allocated to the different conditions?'
    control_operations:
        legend: 'Control Operations'
        label: ''
    other_control_operations:
        label: 'If other, please specify'
    treatment_groups:
        legend: 'Study arms/Treatment groups'
        label: 'A list including all study arms or treatment conditions or (treatment) groups.'
        add: 'Add another treatment group'
    research_method_description:
        legend: 'Research method description'
        label: 'Please provide a detailed description of the research methodology.'
    measurement_occasions:
        legend: 'Measurement occasions'
        label: 'Name of a measurement occasion where data were collected (e.g. t1, baseline, follow-up).'
        add: 'Add another measurement occasion'
        remove: 'Remove Occasion'
    constructs:
        legend: 'Constructs'
        label: 'Name all theoretical constructs collected during this study'
        add: 'Add another construct'
        remove: 'Remove Construct'
    measurement_instruments:
        legend: 'Measurement instruments'
        label: 'Name all measurement instruments used during this study'
        add: 'Add another instrument'
        remove: 'Remove Instrument'

theory_meta_data_group:
    objectives:
        legend: 'Objectives'
        label: 'Outline the a) objectives and b) research questions that informed the methodology and analyses described below.'
    hypotheses:
        legend: 'Hypotheses'
        label: 'State the hypotheses examined, indicating which were prespecified.'
    theories:
        legend: 'Relevant theories'
        label: 'Provide a concise overview that justified the research questions/hypotheses.'
