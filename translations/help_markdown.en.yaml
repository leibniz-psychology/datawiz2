study_introduction:
    section: |
        # Help getting started

        Here you'll find a quick introduction about how to use DataWiz to document a study, its datasets and materials.
    help_intro: |
        A click on a (?)-button reveals further help and background information about the respective study element. You'll find examples or online resources that should make using DataWiz a breeze

        ### Examples

        > Here's an example text

        > Here's another example text
    step_by_step: |
        Follow these steps to make your data understandable, discoverable, citable and reusable.

        1. **Describe your study** including basic information as well as research study level documentation

        - The **Resource description** on your study enables other researchers to find and cite your data
        - The **Study goals** part helps explain the aims of the study
        - **Study method** is all about how your study was carried out
        - In **Data collection**, you'll describe how you gathered the information on your variables of interest. Which measures and which equipment did you use?
        - In **Sampling**, you'll provide information about your study's sample.

          Together with the documentation of your datasets it helps someone not familiar with the data understand, and use the data.

          2. **Upload and describe datasets** and codebooks. The datasets documentation describes what the entries in your data matrix mean. It is sometimes called a codebook or a data-dictionary. It explains the variables used in your study, such as the names given to variables, how they were defined, and their possible response options. If your data is in proprietary format, DataWiz will convert it to a sustainable (open) format.
          3. **Upload materials** The more information you provide, the better others can understand your data. Supplementary documentation that can be associated with datasets helps to facilitate data reuse. You can upload any kind of supplementary materials like associated analyses, or experimental-control data.
          4. **Review input** to check the documentation you provided. Share an overview of your documentation with fellow researchers to get feedback.
          5. Finally, **Export** your data its documentation and the related materials as a ZIP file.
theory:
    section: |
        # Objectives & hypotheses help

        State the problem under investigation. How did you go about answering your research question? Why did you pick this design to answer this question?
    objectives: |
        What is the specific objective/aim of your study, or what question(s) do you want to investigate?
        Providing this information helps others to understand why the data was collected in the first place and puts it into context.

        ### Example

        > The general aim of this research is to differentiate moral obligation from moral norms and moral conviction, as well as to compare their ability to predict collective action. In order to do so, the research objectives are: (a) conceptualize and operationalize moral obligation (Study 1, N = 171); (b) test its predictive power for intention to participate in protests (Study 2, N = 622); and (c) test moral obligation in a real context (Study 3, N = 407).
    hypotheses: |
        If you tested hypotheses in your study,
        it is important that these were formulated (and preregistered) before data collection or analysis so that they are not influenced by the data.
        This is important to ensure that the conclusions you draw based on your findings are valid!

        If you did not have any a priori hypotheses, your study was exploratory – in this case, report your research questions under the item ‘Exploratory research questions’ below.

        ### Example

        > With increasing loads on working memory and old age the asymptotic accuracy in the time-accuracy functions and the rate of approach to the asymptote decrease.
    exploratory_research_questions: |
        Investigating exploratory questions means that you did not have strong hypotheses about the effects to be found beforehand.

        Studies can be:
        - Purely hypothesis-testing (i.e., only including confirmatory analyses based on a priori hypotheses)
        - Purely exploratory (i.e., pure data exploration without a priori hypotheses in order to identify patterns and, based on these, generate hypotheses that can be tested in a separate study)
        - Both components may be present (i.e., a study contains both confirmatory tests of a priori hypotheses and additional exploratory analyses).

        It is very important that exploratory analyses are labelled as such later on so that the results can be interpreted validly.

    theories: |
        Similar to the theoretical background section of a paper, you can describe here how you arrived at your research question/hypothesis, e.g., which research of others (or your own) or theories it is based on.
        Providing the theoretical background to your data can help others to understand it and put it into context.

        This field should contain any relevant theoretical and/or practical/methodological justification. If this is a replication or follow-up study of previous research, describe it and its relationship to the current study.
        Please include references here and list them at the end of this document in the reference section (see R1).

data_management_plan:
    section: |
        # Why you need a data management plan

        Data Management Plans are a crucial part of the data management process. They outline the steps that should be taken to ensure that your data are stored in a safe and secure manner, and that they are accessible to the intended audience.
    administrative_data:
        section: |
            # Administrative data help

            Here you can provide general information regarding the framework of your project.
        target_audiences: |
            The plan may be required by the funding agency or your institution. It may also aim at coordinating project partners or proving good scientific practice.
    introduction:
        section: |
            # Help getting started

            Here you'll find a quick introduction about how to use DataWiz to create a data management plan.
        help_intro: |
            A click on a (?)-button reveals further help and background information about the respective element. You'll find examples or online resources that should make using DataWiz a breeze
    review:
        section: |
            # Review your plan

            Here you can review your data management plan and check for completion and correctness.
    research_data:
        section: |
            # Research data help

            In order to plan the research data management it is first of all important to indicate which type of research data you are going to generate, use and save during the project.
        existing_data_reuse: |
            At the beginning of the project it should be checked if new data needs to be collected. The search for already existing data should include data catalogues of the researcher's institution and of third parties. For economical reasons, research questions should, if possible, be answered using publicly accessible data of national panel studies or existing data sets in repositories.
            Using already existing data does not preclude the generation of additional new data, for example existing data could be used as comparison group.
        data_collection_reproducibility: |
            To what extent is the data collection process reproducible? Data collections for secondary analyses (reuse of existing research data, meta analyses, bibliographical analyses) or simulation studies typically show a high degree of reproducibility.
        file_formats: |
            In which file formats will the data exist after data collection or digitalization of original records? Which file formats will be used in the course of the project (e.g. transformation of data for import in statistical software)? Will data be saved in different file formats in order to increase accessibility?
        data_preservation_working_copy: |
            In most projects, all data collected during the project will be stored as working copies during the project. This also applies to data types such as person related data, which will not be archived or made accessible for reuse, because those data contain information that is required during the project for contacting study participants. Explain, to which data this reason applies and how long they are stored, under storage duration.
        data_preservation_good_scientific_practice_proof: |
            Data which are the foundation of a publication should be preserved for at least 10 years according to the DFG recommendations for Safeguarding Good Scientific Practice. Explain, to which data this reason applies and how long they are stored, under storage duration.
        data_preservation_legal_obligations: |
            Are the data subject to legal (e.g. Pharmaceutical Drug Law, Patent Law) or contractual requirements (e.g. contracts with funder or publisher) pertaining to their storage? Explain, to which data this reason applies and how long they are stored, under storage duration. Which data have to be stored according to these contractual requirements?
        storage_duration: |
            Storage duration may vary depending on the type of data concerned. For example, personal data should be deleted as soon as they are no longer needed to fulfill the research's purpose. If relevant documents exist, we recommend storing these under project materials.
        deletion_procedures: |
            Which procedures are deployed for deleting digital data or disposing non-digital data(e.g. paper questionnaires, biological samples)? How are you going to document the deletion/disposal? How will compliance with data protection laws be ensured? In case you created Standard Operating Procedures, we recommend storing the respective documents under project materials.
        data_selection: |
            Data selection can also take place as the consequence of data cleaning procedures.

            ### Examples

            > deletion of test runs

            > interrupted measures

            > unprocessed raw data

            > analog data

            > working copies

            > laboratory measures

            > personal data

            > protocols

            > scripts

            > simulated data

    documentation:
        section: |
            # Documentation help

            In order to enable other researchers to use your research data sustainably, it is necessary to describe the project and the collected data as precisely as possible.
        purpose: |
            What purpose should the metadata serve or what is their use?
            The most frequent purpose of documenting the data generated during your project will probably be to generate "interpretable" data.

            ## Interpretation
            Refers to providing additional information to ensure the comprehensibility of the data (including study-level information regarding the context of the data collection or variable-level information which is often found in codebooks).

            ## Exchange
            Refers to information which is used to synchronize the data. This can be useful when data have been collected on separate locations and have to be merged or synchronized based on this information.

            ## Administration
            Refers to information used to manage data. This includes versioning and name schemes as well as checksums.
        content: |
            Which information is to be described by metadata (e.g. information on data collection, technical equipment, instruments, encoding or software)?
            The content of the documentation should be tailored to the purpose of the documentation and the intended subsequent use of the data.
        standardization: |
            Does a specific (discipline specific or multidisciplinary) standard exist, which can be applied for generating the metadata (e.g. DDI or Dublin Core), or is the documentation generated unstandardized or by means of self-developed reports and forms?
            Which meanings can be depicted with specific standards (usually standards will not cover all aspects of your documentation)?
            If applicable, refer to corresponding reports or forms under project materials.
        generating_procedure: |
            When and by whom will which metadata be generated? Can metadata be collected automatically (e.g. log-files, versioning tools)?
            In case you created Standard Operating Procedures, we recommend storing the respective documents under project materials.
        monitoring: |
            Using specialized software such as DataWiz automatically ensures technical accuracy of the metadata that you entered.
            Metadata standards often provide predefined schemes to ensure formal accuracy of the metadata.
            Even if you document your data in a self-developed framework you can use data entry forms that only allow a set of predefined values for each field.
            In case you created Standard Operating Procedures, we recommend storing the respective documents under project materials.
    data_sharing:
        section: |
            # Data sharing help

            Data sharing should be considered by all means during the planning of handling research data. If there are reasons which hinder data sharing, these reasons should be listed.
        intended_use: |
            Information regarding institutions or groups which will probably be interested in using the data and how they are expected to use the data (e.g. scientific, political, or commercial relevance and potential of the data).
            If applicable, provide information on potential risks, such as re-identification of subjects.
        usage_restriction: |
            Are (standardized) licenses assigned? Licenses allow data depositors to determine how their data can be used.
            Additionally, some data centers stipulate further terms of use of their own.
            If applicable, refer to corresponding documents (e.g. acquisition agreement) under project materials.
        repository_responsibilities_fixation: |
            Are the data producer's and data archive's or repository's rights and responsibilities clarified?
            Who is responsible for which part of the data ingest?
            Are there contractual regulations for tasks like generating additional metadata, conversion of files, and implementation of the agreed access conditions?
            If applicable, refer to corresponding documents (e.g. acquisition agreement) under project materials.
        acquisition_agreement: |
            For large data volumes or data in unusual formats and data requiring further processing for reasons of data protection, an acquisition agreement can be useful.
            Fixing such an agreement beforehand should also be considered, if data are supposed to be published on a specific date (e.g. as a publication's appendix).
            If applicable, refer to corresponding documents under project materials.
        persistent_identifier_use: |
            In contrast to describing the storage location of a file via web address (URL), describing the storage location using a persistent identifier will ensure findability even if the web address changes (e.g. during a restructuring of the data archive's website).
            A persistent identifier guarantees therefore long-term findability of digital objects on the internet.
            Thus, using persistent identifiers is required for making data permanently citable.
            Digital Object Identifier (DOI) are commonly used as persistent identifiers in psychology and assigned to both, journal and data publications.
        no_sharing_explanation: |
            Will data not be shared for reasons of data protection (e.g. sharing prohibited by ethics committee), for reasons of confidentiality (e.g. contractual agreement for data collections within a company) or for other reasons?
    storage_infrastructure:
        section: |
            # Storage infrastructure help

            Data loss or unintended file changes can be avoided by applying appropriate measures for securing and storing research data.
        storage_locations: |
            Regarding the handling of digital data, please refer to the policies of the responsible data center or of other responsible parties for storing the data.
            Digital copies should not be saved exclusively locally (e.g. local drive on computer) by all means. Because of data protection reasons (BDSG § 40 (2)), personal data, which allow identification of research subjects (e.g. address), and research data has to be stored separately.
            Furthermore, regarding the storage of analog data, appropriate precautions should be addressed at an early stage (e.g. questionnaires with personal data, appropriate storage of biological samples).
            In case you created Standard Operating Procedures, we recommend storing the respective documents under project materials.
        expected_volume: |
            Please try to roughly estimate the unit of the volume of generated data (MB, GB, TB).
            Data volume of most psychological studies will not exceed GB and therefore can be easily handled.
            If you will produce significantly larger volumes of data, you should consider this when planning data storage and transfer.
            Furthermore, you should clarify that the expected data volume does not present a problem for your repository, data center or other responsible persons.
    organization_policies:
        section: |
            # Organization and policies help

            If you are conducting research in projects which involve a multitude of contributors and project partners it is recommendable to define expected contributions of single coworkers or project partners.
    ethical_legal:
        section: |
            # Ethical and legal aspects help

            Ethical and legal requirements which are placed upon psychological research (in Germany) include the adherence to the ethical guidelines of the DGPs, to the Bundesdatenschutzgesetz (BDSG) as well as to copyright laws (Urheberrechtsgesetz, UrhG) and other related property rights.
        ethical_review: |
            For your guidance on the necessity of an ethics committee approval, you can refer to the
            <a href="https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/ethical-considerations" target="_blank">knowledge base</a>
            . In case that an ethical review has been received, we recommend storing the respective documents under project materials.
    costs:
        section: |
            # Costs help

            High-quality data management is labor-intensive and can lead to costs.
            Many funders will bear these additional costs if they are outlined in the project proposal and if the data resulting from the project are published.
            It is therefore in your best interest to plan the costs associated with data management in advance.
        data_management_costing: |
            Costs can, amongst others, be assessed by using reference values, which means assessment based on pilot studies' or comparable studies' available data. Alternatively costs can be assessed using a lifecycle analysis, which means estimating and adding up all costs which arise during the life cycle of the data per data management step.
    settings:
        section: |
            # Settings help

