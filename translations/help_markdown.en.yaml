basic:
    section: |
        # Resource description help

        The resource description describes and identifies your data and enables other researchers to find and cite it. It makes it visible to search engines and retrieval systems. It identifies you as the creator and ensures that you get appropriate credit for your work.
    title: |
        The title informs the reader about the topic.
        It's important metadata that helps make your submission findable.
        If there are already publications based on this data, the title mentioned here can be based on them.
    title_translated: |
        Providing an English translation of your title increases the findability of your data.
        More information on metadata is available at the RDC Knowledge Base:

        <a href="https://rdc-psychology.org/en/rdc-knowledge-base/during-data-collection/documentation-of-research-data" target="_blank">https://rdc-psychology.org/en/rdc-knowledge-base/during-data-collection/documentation-of-research-data</a>
    description: |
        In general, this summary should contain statements on the theoretical background, important research questions,
        empirical methods, results of the study and their interpretation.
        You can also refer to a corresponding publication (in this case, the relevant publication should be provided as supplement).
        More information on descriptive metadata is available at the RDC Knowledge Base:

        <a href="https://rdc-psychology.org/en/rdc-knowledge-base/during-data-collection/documentation-of-research-data" target="_blank">https://rdc-psychology.org/en/rdc-knowledge-base/during-data-collection/documentation-of-research-data</a>
    description_translated: |
        Providing an English translation of your description increases the findability of your data.
        More information on metadata is available at the RDC Knowledge Base:

        <a href="https://rdc-psychology.org/en/rdc-knowledge-base/during-data-collection/documentation-of-research-data" target="_blank">https://rdc-psychology.org/en/rdc-knowledge-base/during-data-collection/documentation-of-research-data</a>
    data_status: |
        If the data you plan to share comprises the full collected dataset, indicate "complete".
        If only part of the data are shared, indicate "subset".
        More information on data integrity and data selection procedures is available at the RDC Knowledge Base:

        <a href="https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/data-integrity-data-selection" target="_blank">https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/data-integrity-data-selection</a>
    used_softwares: |
        Using open source software increases transparency, especially when it is available for free. Below, we present some examples you might want to try out.

        ## Python
        Python is a widely applicable and powerful language that can be used to program experiments and analyze data.
        Here's a guide for beginners: <a href="https://www.python.org/about/gettingstarted/" target="_blank">https://www.python.org/about/gettingstarted/</a>

        ## OpenSesame
        OpenSesame is a free, open-source software to create experiments for psychology, neuroscience, and experimental economics.
        It provides an easy-to-use graphical interface that uses Python and JavaScript as its basis.
        Since you do not have to type out the programming language yourself from scratch, it makes working with Python much easier, especially for beginners.
        Opensesame is freely available here: <a href="https://osdoc.cogsci.nl/" target="_blank">https://osdoc.cogsci.nl/</a>

        If you want to learn more about how to use OpenSesame and Python, you might want to take a look at this workshop by the OpenSesame's creator Sebastiaan Mathôt:
        <a href="https://doi.org/10.23668/psycharchives.3480" target="_blank">https://doi.org/10.23668/psycharchives.3480</a>
        (materials: <a href="https://doi.org/10.23668/psycharchives.3475" target="_blank">https://doi.org/10.23668/psycharchives.3475</a>).

        ## R
        Another powerful language for statistical computing in many disciplines of research is R.
        The software is open source, freely available and has a thriving community.
        If you have not worked with R before but are interested, here's a recording of an R Crash Course given at ZPID, that covers the topics:

        1. introduction into R
        2. reading, saving, and viewing data
        3. selecting and changing objects in R
        4. descriptive statistics: <a href="https://doi.org/10.23668/psycharchives.5312" target="_blank">https://doi.org/10.23668/psycharchives.5312</a>.


        The related materials are available here: <a href="https://doi.org/10.23668/psycharchives.5308" target="_blank">https://doi.org/10.23668/psycharchives.5308</a>.
        Most people use R with RStudio, which provides an interface to use this language.
        If you want to use R this way, you need to download R (<a href="https://www.r-project.org/" target="_blank">https://www.r-project.org/</a>) and RStudio (<a href="https://posit.co/downloads/" target="_blank">https://posit.co/downloads/</a>).

        ### Example

        > OpenSesame was used to implement the experiment

        > R was used to analyze the data).
    related_publications: |
        If several publications are based on this data, please list them all as separate entries.
        Please include both the citation and a persistent identifier (e.g., the DOI) for each publication so that they are clearly identifiable and accessible.

        ### Example <a href="" target="_blank"></a>

        > Oberauer, K. & Kliegl, R. (2001). Beyond resources - formal models for complexity effects and age differences in working memory. European Journal of Cognitive Psychology, 13, 187-215.
    conflicts_of_interest: |
        Financial (or other personal) interests may play a role in decision making. The American Psychological Association (2017, see <a href="http://www.apa.org/about/policy/member-conflict-interests" target="_blank">http://www.apa.org/about/policy/member-conflict-interests</a>) describes the following situations where conflicts of interest can arise:
        1. Financial benefit to self or someone professionally or personally close
        2. Substantial benefit to self or someone professionally or personally close (e.g., positional status, personal or professional advantages)
        3. Cross-organizational role conflicts (e.g., a direct or indirect influence on another organization which the author has a vested interest in)
        4. Additional benefits or impacts (e.g., promises of future financial benefit, access to participation in other groups; marginalization, threats of legal actions etc.)
    creators: |
        Provide in separate entries the full name of each contributor, each contributor's professional affiliation, and each contributor's persistent ID (see ORCID iD for an example, <a href="https://orcid.org/" target="_blank">https://orcid.org/</a>).
        Assign at least one contributor as principal investigator and corresponding author (their email address will be displayed alongside the data).
        Ensure to obtain approval from all co-authors before publishing the data.

        ## ORCID

        ORCID iD is a free and widely used persistent researcher ID.
        If you have not yet set up an ORCID iD, we recommend doing so.
        It makes sense to have a persistent researcher ID that does not depend on the respective affiliation, as researchers often switch between different positions and institutions.
        This ensures that your research outputs can be assigned to you sustainably and consistently.
codebook:
    section: |
        You should definitely create one and provide it with your data.
    itemText: |
        The exact question in surveys; the instruction text

        ### Examples

        > What is your university degree

        > Press the response key when you see a red dot.
    measure: |
        The measure as defined in the study documentation

        Examples

        > Example 1

        > Example 2
    missings: |
        The code(s) for missing values; should be radically different from non missing values (categorical variables) or impossible values (for continuous variables)
        The labels for the missing values

        ### Examples

        > 9=no answer

        > -999=no key pressed
    valueLabels: |
        Lists each code and associated label for the variable (an exhaustive list of numeric values and their corresponding value labels)

        ### Example

        > 0=female

        > 1=male
    variableLabel: |
        A brief description to identify the variable.

        ### Examples

        > age in years

        > patient key
    variableName: |
        The short, unique, and unambiguous name of the variable. One word only. Use letters, numbers and underscores, avoid spaces.

        ### Examples

        > age

        > pat_key

measure:
    section: |
        # Data collection help

        How did you gather the information on your variables of interest? Which measures and which eqipment did you use?
    collection_mode: |
        If the investigator was present during the data collection, please consider that observer expectancy effects might have occured, that is, participants' behavior might have been unintentionally influenced by the researchers' expectations about the study outcome (Rosenthal, 1976).
    special_circumstances: |
        These could comprise, for example, participants' comments, equipment casualties, disturbances, systematic loss, deleted cases or abnormal data. Providing this information helps others interpret your data correctly.
    raw_data_transformation: |
        More information on data integrity, data cleaning and file formats is available at the RDC Knowledge Base:
        - Data integrity and data cleaning: <a href="https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/data-integrity-data-selection" target="_blank">https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/data-integrity-data-selection</a>
        - File formats: <a href="https://rdc-psychology.org/en/rdc-knowledge-base/during-data-collection/file-formats-versioning" target="_blank">https://rdc-psychology.org/en/rdc-knowledge-base/during-data-collection/file-formats-versioning</a>

        If your lab uses the same preprocessing pipelines for most of its work, these could be standardized as "standard lab practices".
        This refers to a (timestamped) document, software package, or similar, which specifies standard pipelines, analytical decisions, etc. which always apply to certain types of research in a lab.
    quality_indicators: |
        For example, this item relates to how errors in participants' scores or reporting (e.g., entering the wrong age; making a mistake during a cognitive test; providing misleading or silly answers on purpose) were handled, as well as how data was coded during data collection (e.g., recoding cognitive scores or telephone survey responses).

        It is also possible to standardize these kinds of decisions in a lab through "standard lab practices". This refers to a (timestamped) document, software package, or similar, which specifies standard pipelines, analytical decisions, etc. which always apply to certain types of research in a lab.
    limitations: |
        Clearly outlining the limitations of the data helps others to better understand it and draw meaningful conclusions when reusing the data. More information on data integrity is available at the RDC Knowledge Base: <a href="https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/data-integrity-data-selection" target="_blank">https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/data-integrity-data-selection</a>

