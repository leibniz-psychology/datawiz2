sample:
    section: |
        # Sampling help

        How did you select participants (observations, cases) from a population of specific interest for your study?
    inclusion_exclusion_criteria: |
        It is important to report all exclusion criteria transparently, especially if excluded individuals are no longer included in the shared dataset.
        Describe your approach in as much detail as possible.\
        Ideally, these exclusion criteria should be defined (and preregistered) before data collection or analysis so that they are not influenced by the data.
        Therefore, report transparently if exclusion criteria were added during data analysis.
    population: |
        A theoretically defined, complete group of objects (people, animals, institutions) from which a sample is drawn to obtain empirical observations and to which results can be generalized. Identify the population that you're intending to make conclusions about and make sure the selected sample represents that population. If the sample represents a smaller group within that population, then the conclusions have to be downsized in scope also.

        ### Example

        > Study samples had to comprise trauma-exposed, nonclinical adult populations to be included in the analysis.

        <!-- <div x-data="{ count: 5, string: $el.innerHTML, cursor: 'pointer' }" x-text="$truncate(string, { words: count, ellipsis: '] - show full citation' })" @click="count = undefined, cursor = 'default'" :class="{ 'cursor-default' : cursor === 'default', 'cursor-pointer text-right underline' : cursor !== 'default' }" class="text-xs">[Zalta, A. K., Tirone, V., Orlowska, D., Blais, R. K., Lofgreen, A., Klassen, B., Held, P., Stevens, N. R., Adkins, E., & Dent, A. L. (2021). Examining moderators of the relationship between social support and self-reported PTSD symptoms: A meta-analysis. Psychological Bulletin, 147(1), 33-54. https://doi.org/10.1037/bul0000316]</div> -->
    sampling_method: |
        This item helps you outline the inclusion and exclusion criteria for your data collection in detail.
        In addition to the inclusion and exclusion criteria of data points during the analysis (see items "Criteria for post-data collection exclusion of participants and outlier treatment" and "Criteria for post-data collection exclusions on trial or item level"), these can have a major influence on the sample.
    recruiting: |
        This item is designed to help you describe your population of interest, recruitment strategies, compensation, and the characteristics of your sample, (e.g., will your participants be WEIRD - White, Educated, Industrialized, Rich, Democratic?).
        Providing detailed information about these is important because sampling bias can have an influence on any results based on the data (Vaughan-Johnston et al., 2024, <a href="https://doi.org/10.1177/01461672241293504" target="_blank">https://doi.org/10.1177/01461672241293504</a> ).
        You can find a good overview of various recruitment strategies on this Qualtrics Blog: <a href="https://www.qualtrics.com/experience-management/research/sampling-methods/" target="_blank">https://www.qualtrics.com/experience-management/research/sampling-methods/</a>.
        If you used panel providers to collect your sample, it is important to clarify exactly how the sampling process worked with them (e.g., how they considered your defined quotas).
    power_analysis: |
        Statistical power (also called power of a hypothesis test) is the probability that a test will correctly reject a false null hypothesis (Polak, 2020). It is a measure of how effective a statistical procedure is at identifying real differences between populations: It is the probability that use of the test will lead to the null hypothesis of no effect being rejected when the alternative hypothesis is true. For example, if a given statistical test has a power of .70, then there is a 70% probability that its use will result in the null hypothesis correctly being rejected as false, with a corresponding 30% chance that its use will lead to a type ii error. Power ranges from 0 to 1, with values of .80 or above generally considered acceptable. Researchers try to maximize power in their study designs prior to data gathering. (APA Dictionary, 2014) You can use G\*Power as a general stand-alone power analysis program for statistical tests commonly used in social and behavioral research (Erdfelder, Faul, & Buchner, 1996)

        ### Example

        > Required sample sizes of ~30 for each protocol (n = 15 M + n = 15 F) were calculated a priori following pilot and previous observations in our laboratory of sex differences in novel tank test (d = 1.25, power = 0.8, alpha = 0.05).
    sample_size: |
        The sample size is the number of observations (cases, individuals, units) included in the sample to be studied.

        Sample size is a critical factor in determining statistical power, especially in designs that test against a null hypothesis.
        If your statistical power is low, you may fail to detect an existing effect, or you may detect an effect that is not real.
        Daniel Lakens provides an excellent overview of different approaches to justifying sample size in this article:
        <a href="doi.org/10.1525/collabra.33267" target="_blank">doi.org/10.1525/collabra.33267</a>

        ### Examples

        > In total, 41 of the participants completed all of their sessions in their own home ("home group"), 27 participants completed all of their sessions in the lab ("lab group"), and 11 participants completed some sessions at home and some in the lab ("mixed group").

        > There were 76 children tested, all attending Royce primary school, Manchester. They were divided into four age categories according to school class group, as detailed in Table 1.

        > One hundred sixty-six subjects (M age = 20.0 years, 103 female) were recruited from the Washington University in St. Louis Department of Psychology human subject pool.
    multilevel_structure: |
        More information and guidance on multilevel modelling is provided in this book chapter by Leyland & Groenewegen (2020):
        <a href="https://doi.org/10.1007/978-3-030-34801-4_3" target="_blank">https://doi.org/10.1007/978-3-030-34801-4_3</a>
    missing_values: |
        Specify whether the missingness applies to the whole dataset or specific variables (e.g., 5% missing values for item 2). If no data are missing, indicate "none".
    return_dropout: |
        This is important to consider because dropout affects your sample size, and the sample size affects your budget and your statistical power.
        In addition, it can be useful to indicate at which point in the study drop-outs occured.
        If systematic drop-out occured, this could bias the results of your study (e.g., if a certain subgroup of participants drops out at a specific question).

ethics:
    section: |
        # Ethical and Legal Aspects help

        It is important for you to address ethical and legal aspects of your data in order to determine how you can make your data available to potential subsequent users. At the same time, an explicit documentation of the legal characteristics of the data for coordination in the project is indispensable in order to prevent any unintentional breaches of law due to ignorance.
    ethical_review: |
        Obtaining ethical approval is important whenever your study includes human or animal subjects.
        Among other things, this is intended to minimize risks for subjects, analyze costs and benefits of a study, and ensure that informed consent is obtained appropriately.
        Typically, universities provide ethics committees for this purpose.
        More information regarding the circumstances under which an ethics approval is necessary is available at the RDC Knowledge Base:
        <a href="https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/ethical-considerations" target="_blank">https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/ethical-considerations</a>
    informed_consent: |
        An informed consent consists of two parts:

        1. an information sheet which provides information on the study’s purpose, applied procedures and handling of personal data
        2. a consent form which is signed by the participant.

        More information on informed consent forms is available at the RDC Knowledge Base:
        <a href="https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/copyright-and-data-privacy" target="_blank">https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/copyright-and-data-privacy</a>
    personal_data: |
        In which cases would the data be (partially) person-related? If the research data are person-related, this may be because it is indispensable for the purpose of the research (e.g., audio/video recordings or brain images). If the research data are not directly person-related but can be related to individuals with little additional knowledge, this is typically only plausible in the case of data collection from a closed group with rare values or combinations of values.

        More information on data privacy is available at the RDC Knowledge Base:

        - Copyright & Data Privacy:
          <a href="https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/copyright-and-data-privacy" target="_blank">https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/copyright-and-data-privacy</a>
        - Privacy in Data Storing and Publication:
          <a href="https://rdc-psychology.org/en/rdc-knowledge-base/after-data-collection/privacy-in-data-storing-licenses" target="_blank">https://rdc-psychology.org/en/rdc-knowledge-base/after-data-collection/privacy-in-data-storing-licenses</a>
    copyright: |
        Copyright is often overlooked when it comes to data, but is important to consider.
        More information is provided at the RDC Knowledge Base:
        <a href="https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/copyright-and-data-privacy" target="_blank">https://rdc-psychology.org/en/rdc-knowledge-base/before-data-collection/copyright-and-data-privacy</a>

        Additionally, assigning licenses to your data is vital if you want other researchers to know if and under which circumstances they can use it.
        More information on licences is also available at the RDC Knowledge Base:
        <a href="https://rdc-psychology.org/en/rdc-knowledge-base/after-data-collection/privacy-in-data-storing-licenses" target="_blank">https://rdc-psychology.org/en/rdc-knowledge-base/after-data-collection/privacy-in-data-storing-licenses</a>
    third_party_rights: |
        Before sharing data, software, or measurement instruments produced by others, you should consider whether the redistribution of these materials is permitted.
        The copyright is usually indicated alongside the respective materials.
        More information on licenses is available at the RDC Knowledge Base:
        <a href="https://rdc-psychology.org/en/rdc-knowledge-base/after-data-collection/privacy-in-data-storing-licenses" target="_blank">https://rdc-psychology.org/en/rdc-knowledge-base/after-data-collection/privacy-in-data-storing-licenses</a>

